        const slideContentDiv = document.getElementById('slide-content');
        const prevButton = document.getElementById('prev-button');
        const nextButton = document.getElementById('next-button');
        const slideCounter = document.getElementById('slide-counter');

        function renderSlide(index) {
            const slide = slides[index];
            let html = '';

            // Handle the title slide with a different layout
            if (index === 0) {
                html = `
                    <div class="h-full flex flex-col justify-center items-center text-center">
                        <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold text-gray-900 mb-4">${slide.title}</h1>
                        <h2 class="text-xl md:text-2xl lg:text-3xl text-gray-600">${slide.subtitle}</h2>
                    </div>
                `;
            } else {
                html = `
                    <h1 class="text-3xl font-bold text-gray-900 mb-6">${slide.title}</h1>
                    <div class="text-lg leading-relaxed text-gray-700">
                        ${slide.content}
                    </div>
                `;
            }

            slideContentDiv.innerHTML = html;
            updateButtons();
            updateCounter();
        }

        function updateButtons() {
            prevButton.disabled = currentSlideIndex === 0;
            nextButton.disabled = currentSlideIndex === slides.length - 1;
        }

        function updateCounter() {
            slideCounter.textContent = `Slide ${currentSlideIndex + 1} of ${slides.length}`;
        }

        function handleNext() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function handlePrevious() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

        prevButton.addEventListener('click', handlePrevious);
        nextButton.addEventListener('click', handleNext);

        // Initial render
        window.onload = function() {
            renderSlide(currentSlideIndex);
        };
